name: Deploy Web 

on:
  push:
  branches: ["main", "develop"]
workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Upload to S3
        env:
          BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ "s3://$BUCKET/" --delete --exclude "assets/*" --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --paths "/*"

      - name: Discord notify
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEB_WEBHOOK }}
          title: ${{ job.status == 'success' && '🚀 웹 배포 성공 🚀' || '❌ 웹 배포 실패 ❌' }}
          description: ${{ job.status == 'success' && format('{0} 브랜치 웹 배포 완료', github.ref_name) || format('{0} 브랜치 웹 배포 실패. Actions 로그 확인', github.ref_name) }}

  